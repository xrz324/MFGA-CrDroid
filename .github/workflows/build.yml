name: Build MFGA-CrDroid

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*-crd']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install font tooling
        run: python3 -m pip install -r requirements-build.txt

      - name: Check shell syntax
        run: |
          for script in script/*.sh; do
            sh -n "$script"
          done

      - name: Build and validate module
        env:
          BUILD_REF_TYPE: ${{ github.ref_type }}
          BUILD_REF_NAME: ${{ github.ref_name }}
          BUILD_RUN_NUMBER: ${{ github.run_number }}
          BUILD_SHA: ${{ github.sha }}
        run: |
          if [ "$BUILD_REF_TYPE" = tag ]; then
            export MODULE_VERSION="${BUILD_REF_NAME#v}"
          else
            export MODULE_VERSION="dev-${BUILD_RUN_NUMBER}-$(printf '%s' "$BUILD_SHA" | cut -c1-7)"
          fi
          export MODULE_VERSION_CODE="$((1717180004 + BUILD_RUN_NUMBER))"
          python3 build.py

      - name: Upload module
        uses: actions/upload-artifact@v7
        with:
          name: MFGA-CrDroid
          path: dist/MFGA-CrDroid.zip
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && endsWith(github.ref, '-crd')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download module
        uses: actions/download-artifact@v7
        with:
          name: MFGA-CrDroid
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/MFGA-CrDroid.zip --clobber
          else
            gh release create "$RELEASE_TAG" dist/MFGA-CrDroid.zip \
              --verify-tag --title "$RELEASE_TAG" --generate-notes
          fi
